[package]
name = "uniffi-bindgen"
description = "uniffi-bindgen CLI pinned to the workspace's UniFFI version"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
