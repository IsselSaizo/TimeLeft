[workspace]
resolver = "3"
members = ["core", "cli", "tools/lifetable-builder"]
default-members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IsselSaizo/TimeLeft"
rust-version = "1.88"

[workspace.dependencies]
timeleft-core = { path = "core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
